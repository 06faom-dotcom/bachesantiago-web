    <title>BacheSantiago</title>
    <meta name="description" content="Reporta un bache en segundos y ayuda a que nuestras calles mejoren." />
    <!-- Piloto: fuera de los buscadores; solo llega quien tiene el enlace (docs/PLAN.md D74). -->
    <meta name="robots" content="noindex" />
    <!-- «Agregar a pantalla de inicio» (S147): en iPhone y Android se abre como app. -->
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BacheSantiago" />

    <link rel="apple-touch-icon" href="icono.png" />
    <link rel="icon" type="image/png" href="icono.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Regreso de Google (src/datos/google.web.ts): el código se guarda para esta visita y se quita de la
         dirección antes de que arranque la app; si no, el enrutador lo vuelve a poner en la barra. -->
    <script>
      (function () {
        var l = window.location;
        if (!/[?&](code|error)=/.test(l.search) && !/[#&]error=/.test(l.hash)) return;
        try {
          sessionStorage.setItem('bachesantiago-google-regreso', JSON.stringify([l.search, l.hash]));
        } catch (e) {}
        history.replaceState(null, '', l.pathname);
      })();
    </script>
    <!-- Estilos que recomienda react-native-web: la app ocupa toda la pantalla y no se desplaza. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
